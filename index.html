<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <title>Menú digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero"><img id="logo" class="logo" alt="Logo">
      <div>
        <p class="eyebrow">MENÚ DIGITAL</p>
        <h1 id="restaurantName">Restaurante</h1>
        <p id="schedule" class="schedule"></p>
      </div>
    </header>

    <nav class="actions" aria-label="Acciones del restaurante">
      <a id="whatsappBtn" class="action" target="_blank" rel="noopener"><span class="icon icon-whatsapp" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><path fill="currentColor" d="M20.52 3.48A11.82 11.82 0 0 0 12.1 0C5.55 0 .22 5.33.22 11.88c0 2.09.55 4.14 1.6 5.94L.12 24l6.34-1.66a11.86 11.86 0 0 0 5.64 1.44h.01c6.54 0 11.87-5.33 11.87-11.88 0-3.17-1.23-6.15-3.46-8.42Zm-8.41 18.3h-.01a9.83 9.83 0 0 1-5.01-1.37l-.36-.21-3.76.99 1-3.66-.23-.38a9.84 9.84 0 0 1-1.51-5.27c0-5.45 4.44-9.88 9.89-9.88a9.82 9.82 0 0 1 6.99 2.9 9.81 9.81 0 0 1 2.9 6.99c0 5.45-4.44 9.89-9.88 9.89Zm5.42-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.87 1.22 3.07.15.2 2.1 3.21 5.08 4.5.71.31 1.27.49 1.7.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35Z"/></svg>
        </span><span>WhatsApp</span></a>
      <a id="facebookBtn" class="action" target="_blank" rel="noopener"><span class="icon icon-facebook" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><path fill="currentColor" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.69.24 2.69.24v2.98h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.08 24 18.09 24 12.07Z"/></svg>
        </span><span>Facebook</span></a>
      <a id="mapsBtn" class="action" target="_blank" rel="noopener"><span class="icon icon-maps" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><path fill="currentColor" d="M12 1a8 8 0 0 0-8 8c0 5.25 6.72 13.31 7.01 13.65a1.28 1.28 0 0 0 1.98 0C13.28 22.31 20 14.25 20 9a8 8 0 0 0-8-8Zm0 11.5A3.5 3.5 0 1 1 12 5a3.5 3.5 0 0 1 0 7.5Z"/></svg>
        </span><span>Cómo llegar</span></a>
      <a id="callBtn" class="action"><span class="icon icon-phone" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><path fill="currentColor" d="M6.62 10.79a15.47 15.47 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
        </span><span>Llamar</span></a>
    </nav>

    <section class="viewer-section">
      <div class="viewer-header">
        <h2>Nuestro menú</h2>
        <p id="counter">Página 1 de 6</p>
      </div>

      <p id="loadingMenu" class="loading-menu">Cargando menú…</p>
      <div class="viewer" hidden>
        <button id="prevBtn" class="nav-button side-button" type="button" aria-label="Página anterior">‹</button>
        <button id="openViewerBtn" class="image-button" type="button" aria-label="Abrir página en grande">
          <img id="menuImage" alt="Página del menú">
        </button>
        <button id="nextBtn" class="nav-button side-button" type="button" aria-label="Página siguiente">›</button>
      </div>

      <div class="mobile-controls">
        <button id="prevMobile" class="nav-button" type="button">← Anterior</button>
        <button id="nextMobile" class="nav-button" type="button">Siguiente →</button>
      </div>

      <div id="dots" class="dots"></div>
      <p class="hint">Toca la imagen para verla en grande.</p>
    </section>

    <footer>
      <p>Menú digital desarrollado por <strong>Trámites y Servicios Calakmul</strong></p>
    </footer>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="closeLightbox" class="close-lightbox" type="button">×</button>
    <button id="lightboxPrev" class="lightbox-nav prev" type="button">‹</button>
    <div class="zoom-area"><img id="lightboxImage" alt="Página ampliada del menú"></div>
    <button id="lightboxNext" class="lightbox-nav next" type="button">›</button>
    <div class="zoom-controls">
      <button id="zoomOut" type="button">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" type="button">+</button>
      <button id="resetZoom" type="button">Restablecer</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const c = window.MENU_CONFIG;
  document.title = `${c.restaurantName} | Menú`;
  document.getElementById("restaurantName").textContent = c.restaurantName;
  document.getElementById("schedule").textContent = c.schedule || "";

  const logo = document.getElementById("logo");
  if (logo && c.logo) {
    logo.src = c.logo;
    logo.hidden = false;
  }

  [
    ["whatsappBtn", c.whatsapp ? `https://wa.me/${c.whatsapp.replace(/\D/g, "")}` : ""],
    ["facebookBtn", c.facebook],
    ["mapsBtn", c.maps],
    ["callBtn", c.phone ? `tel:${c.phone.replace(/\D/g, "")}` : ""]
  ].forEach(([id, url]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (url) el.href = url;
    else el.hidden = true;
  });

  const pages = Array.isArray(c.menuImages) ? c.menuImages : [];
  let current = 0;
  let zoom = 1;
  let touchStartX = 0;

  const menuImage = document.getElementById("menuImage");
  const lightboxImage = document.getElementById("lightboxImage");
  const lightbox = document.getElementById("lightbox");
  const dots = document.getElementById("dots");
  const counter = document.getElementById("counter");
  const zoomLabel = document.getElementById("zoomLabel");
  const viewer = document.querySelector(".viewer");
  const loading = document.getElementById("loadingMenu");

  const prevButtons = ["prevBtn","prevMobile","lightboxPrev"].map(id => document.getElementById(id)).filter(Boolean);
  const nextButtons = ["nextBtn","nextMobile","lightboxNext"].map(id => document.getElementById(id)).filter(Boolean);

  const cache = new Map();
  function preload(src){
    if (cache.has(src)) return cache.get(src);
    const promise = new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(src);
      img.onerror = ()=>reject(new Error(src));
      img.src = src;
    });
    cache.set(src,promise);
    return promise;
  }

  function resetZoomView(){
    zoom = 1;
    if (lightboxImage) lightboxImage.style.transform = "scale(1)";
    if (zoomLabel) zoomLabel.textContent = "100%";
  }

  function updateControls(){
    counter.textContent = pages.length ? `Página ${current + 1} de ${pages.length}` : "Sin páginas";
    dots.querySelectorAll(".dot").forEach((dot,i)=>dot.classList.toggle("active",i===current));
    prevButtons.forEach(btn=>btn.disabled=current===0);
    nextButtons.forEach(btn=>btn.disabled=current>=pages.length-1);
  }

  async function renderPage(){
    if (!pages.length){
      loading.textContent = "No se encontraron páginas del menú.";
      viewer.hidden = true;
      return;
    }

    loading.hidden = false;
    loading.textContent = "Cargando menú…";
    menuImage.classList.remove("is-loaded");

    try{
      const src = await preload(pages[current]);
      menuImage.src = src;
      lightboxImage.src = src;
      menuImage.alt = `Página ${current + 1} del menú`;
      lightboxImage.alt = menuImage.alt;
      viewer.hidden = false;
      loading.hidden = true;
      requestAnimationFrame(()=>menuImage.classList.add("is-loaded"));
      updateControls();
      resetZoomView();
    }catch{
      viewer.hidden = true;
      loading.hidden = false;
      loading.textContent = "No se pudo cargar esta página del menú.";
      updateControls();
    }
  }

  pages.forEach((_,i)=>{
    const dot = document.createElement("button");
    dot.type = "button";
    dot.className = "dot";
    dot.addEventListener("click",()=>{current=i;renderPage();});
    dots.appendChild(dot);
  });

  function previous(){ if(current>0){current--;renderPage();} }
  function next(){ if(current<pages.length-1){current++;renderPage();} }

  prevButtons.forEach(btn=>btn.addEventListener("click",previous));
  nextButtons.forEach(btn=>btn.addEventListener("click",next));

  document.getElementById("openViewerBtn")?.addEventListener("click",()=>{
    lightbox.hidden=false;
    document.body.classList.add("no-scroll");
    resetZoomView();
  });

  document.getElementById("closeLightbox")?.addEventListener("click",()=>{
    lightbox.hidden=true;
    document.body.classList.remove("no-scroll");
  });

  document.getElementById("zoomIn")?.addEventListener("click",()=>{
    zoom=Math.min(3,zoom+.25);
    lightboxImage.style.transform=`scale(${zoom})`;
    zoomLabel.textContent=`${Math.round(zoom*100)}%`;
  });

  document.getElementById("zoomOut")?.addEventListener("click",()=>{
    zoom=Math.max(1,zoom-.25);
    lightboxImage.style.transform=`scale(${zoom})`;
    zoomLabel.textContent=`${Math.round(zoom*100)}%`;
  });

  document.getElementById("resetZoom")?.addEventListener("click",resetZoomView);

  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") previous();
    if(e.key==="ArrowRight") next();
    if(e.key==="Escape" && lightbox && !lightbox.hidden){
      lightbox.hidden=true;
      document.body.classList.remove("no-scroll");
    }
  });

  [menuImage,lightboxImage].filter(Boolean).forEach(img=>{
    img.addEventListener("touchstart",e=>touchStartX=e.changedTouches[0].clientX,{passive:true});
    img.addEventListener("touchend",e=>{
      if(zoom>1) return;
      const d=e.changedTouches[0].clientX-touchStartX;
      if(d>50) previous();
      if(d<-50) next();
    },{passive:true});
  });

  renderPage().then(()=>pages.forEach(src=>preload(src).catch(()=>{})));
});
</script>
</body>
</html>
